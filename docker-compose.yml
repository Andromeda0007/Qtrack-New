services:
  db:
    image: postgres:16-alpine
    container_name: qtrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qtrack
    ports:
      - "5432:5432"
    volumes:
      - qtrack_pgdata:/var/lib/postgresql/data

volumes:
  qtrack_pgdata:
